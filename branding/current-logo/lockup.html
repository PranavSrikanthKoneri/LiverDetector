<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent;}
  .header-brand { display:flex; align-items:center; gap:8px; padding:0; border:0; background:transparent; color:#182a32; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .brand-mark { width:26px; height:26px; border:1.5px solid #225e91; border-radius:50%; display:grid; place-items:center; flex-shrink:0; }
  .brand-mark span { width:14px; height:14px; border:1.5px solid #225e91; border-radius:50% 50% 4px 50%; transform:rotate(-35deg); }
  .header-title { font-size:1.25rem; letter-spacing:-0.055em; font-weight:400; }
  .brand-period { color:#225e91; }
  .scale8 { transform: scale(8); transform-origin: top left; }
</style></head><body>
  <div id="stage" style="display:inline-block; padding:4px;">
    <div class="header-brand scale8">
      <span class="brand-mark"><span></span></span>
      <span class="header-title">FibroLens<span class="brand-period">.</span></span>
    </div>
  </div>
</body></html>
