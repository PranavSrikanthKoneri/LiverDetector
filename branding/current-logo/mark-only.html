<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent;}
  .brand-mark { width:26px; height:26px; border:1.5px solid #225e91; border-radius:50%; display:grid; place-items:center; }
  .brand-mark span { width:14px; height:14px; border:1.5px solid #225e91; border-radius:50% 50% 4px 50%; transform:rotate(-35deg); }
  .scale16 { transform: scale(16); transform-origin: top left; }
</style></head><body>
  <div style="display:inline-block;padding:2px;">
    <span class="brand-mark scale16"><span></span></span>
  </div>
</body></html>
